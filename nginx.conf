server {
    listen 80;
    server_name remont.stroycash.ru;
    root /var/www/html;

    charset utf-8;

    # ── Производительность сервера ────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # ── Gzip-сжатие ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_types
        text/plain text/css text/html text/javascript text/xml text/x-component
        application/javascript application/json application/xml application/rss+xml
        application/atom+xml font/truetype font/opentype application/vnd.ms-fontobject
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Preconnect для Tilda CDN (ускоряет загрузку JS/CSS/шрифтов) ───────
    add_header Link "</css/custom.css>; rel=preload; as=style, </js/custom.js>; rel=preload; as=script" always;

    # ── Кэш HTML-страниц (1 час + revalidate) ────────────────────────────
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Cache: custom.css / custom.js — 1 час, revalidate ────────────────
    location ~* /custom\.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # ── Cache: остальные CSS/JS (Tilda, versioned) — 30 дней ─────────────
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── WebP auto-serving ─────────────────────────────────────────────────
    # map: если браузер принимает webp — суффикс ".webp", иначе ""
    # Файлы хранятся как photo.jpg + photo.jpg.webp (рядом)
    # try_files сначала пробует photo.jpg.webp, потом photo.jpg
    location ~* \.(jpe?g|png)$ {
        expires 90d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        add_header Vary Accept;
        access_log off;
        set $webp "";
        if ($http_accept ~* "webp") { set $webp ".webp"; }
        try_files $uri$webp $uri =404;
    }

    # ── Cache: WebP, GIF, SVG, иконки, шрифты ─────────────────────────────
    location ~* \.(webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 90d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        access_log off;
    }

    # ── llms.txt — явный content-type для AI-краулеров ───────────────────
    location = /llms.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # ── Служебные пути — запрет ───────────────────────────────────────────
    location /data/ { deny all; return 404; }

    # ── Главная страница — блог о ремонте ────────────────────────────────
    location = / {
        try_files /article_blog.html =404;
    }

    # ── /blog → главная (SEO: один canonical) ─────────────────────────
    location = /blog {
        return 301 /;
    }

    # ── Запрет прямого доступа к page*.html (SEO: нет дублей) ─────────────
    location ~* ^/page\d+\.html$ {
        return 301 /;
    }

    # ── PHP (form_handler) ────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout 30s;
    }

    # ── Slug → страницы ───────────────────────────────────────────────────
    location = /policy       { try_files /page55196169.html =404; }
    location = /remont-old   { try_files /page27262071.html =404; }
    location = /quiz         { try_files /page55131289.html =404; }
    location = /build        { return 301 /; }
    location = /remont       { try_files /page34319973.html =404; }
    location = /remontdomov  { try_files /page34448363.html =404; }
    location = /klinika      { try_files /page34448545.html =404; }
    location = /engineering  { try_files /page27262068.html =404; }
    location = /disign       { try_files /page27262073.html =404; }
    location = /shtukaturka  { try_files /page30554334.html =404; }
    location = /styajka      { try_files /page37346001.html =404; }
    location = /pomesheniya  { try_files /page34448315.html =404; }
    location = /stomatologiy { try_files /page34448619.html =404; }
    location = /mebel        { try_files /page39349977.html =404; }
    location = /portfolio    { try_files /page27262075.html =404; }
    location = /about        { try_files /page27176351.html =404; }
    location = /team         { try_files /page37551065.html =404; }
    location = /thankyou     { try_files /page34361870.html =404; }
    location = /remont2      { try_files /page37914626.html =404; }
    location = /calculator   { try_files /page27262080.html =404; }
    location = /vanna        { try_files /page34448199.html =404; }
    location = /sanuzel      { try_files /page34448265.html =404; }
    location = /kotedzh      { try_files /page34448395.html =404; }
    location = /ofisov       { try_files /page34448443.html =404; }
    location = /novostroika  { try_files /page34448501.html =404; }
    location = /otdelka      { try_files /page34448654.html =404; }
    location = /novostroika2 { try_files /page39375218.html =404; }
    location = /buildtest    { return 301 /; }
    location = /quizstroy    { return 301 /; }
    location = /quizmebel    { try_files /page55193637.html =404; }
    location = /agreement    { try_files /page90290286.html =404; }
    location = /cookie-files { try_files /page90298606.html =404; }

    # ── Статьи ────────────────────────────────────────────────────────────
    location = /stoimost-remonta              { try_files /article_stoimost_remonta.html =404; }
    location = /chto-vhodit-v-remont          { try_files /article_etapy_remonta.html =404; }
    location = /remont-v-novostrojke          { try_files /article_novostrojka.html =404; }
    location = /remont-vannoj-cena            { try_files /article_vanna.html =404; }
    location = /kak-vybrat-stroitelnuyu-kompaniyu { try_files /article_kak_vybrat.html =404; }
    location = /stroitelstvo-doma-podmoskovye { return 301 /; }
    # /blog → редирект на / (задан выше)

    location / { try_files $uri $uri/ =404; }

    error_page 404 /page52048683.html;
}
