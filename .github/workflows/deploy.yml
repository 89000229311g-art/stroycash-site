name: Deploy to remont.stroycash.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Create remote dirs
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p 22 \
            root@185.154.52.237 \
            "mkdir -p /var/www/remont.stroycash.ru /root/stroycash-remont"

      - name: Deploy HTML/CSS/JS files
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p 22" \
            --exclude='images/' \
            stroycash/ \
            root@185.154.52.237:/var/www/remont.stroycash.ru/

      - name: Deploy nginx.conf
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -P 22 \
            nginx.conf \
            root@185.154.52.237:/root/stroycash-remont/nginx.conf

      - name: Reload nginx
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p 22 \
            root@185.154.52.237 \
            "docker exec remont-site nginx -s reload 2>/dev/null && echo 'nginx reloaded' || echo 'nginx reload skipped (container not running)'"
