name: Deploy to remont.stroycash.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy files to server
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            --exclude='images/' \
            stroycash/ \
            root@185.154.52.237:/var/www/remont.stroycash.ru/

      - name: Reload nginx
        run: |
          sshpass -p '${{ secrets.SERVER_PASS }}' ssh \
            -o StrictHostKeyChecking=no root@185.154.52.237 \
            "docker exec remont-site nginx -s reload"
